name: Create Release
run-name: "Create Release from #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [closed]
    branches:
      - main*

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Strip 'releases/' prefix from source branch
        id: branch_name
        run: |
          raw="${{ github.event.pull_request.head.ref }}"
          echo "value=${raw#releases/}" >> "$GITHUB_OUTPUT"
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: klutch-bind-*
          merge-multiple: true
          path: binaries/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.event.pull_request.head.sha }}
          tag_name: ${{ steps.branch_name.outputs.value }}
          name: ${{ steps.branch_name.outputs.value }}
          token: ${{ github.token }}
          generate_release_notes: true
          files: binaries/*
      - name: Delete binary artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
            name: |
                klutch-bind-*
